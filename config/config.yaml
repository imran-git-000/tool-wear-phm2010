data:
  cutters: [c1, c4, c6]
  val_fraction: 0.1
  hop: 2048
  batch_size: 128
  num_workers: 0

model:
  num_channels: 7
  window_size: 2048
  patch_size: 64
  hidden_size: 128
  num_hidden_layers: 3
  num_attention_heads: 8
  intermediate_size: 256
  dropout: 0.1

training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5
  device: auto
  seed: 0
  checkpoint_name: encoder

evaluation:
  aggregation: median
  output_artifacts: encoder
